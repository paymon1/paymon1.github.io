<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10110d"><meta name="description" content="Paymon — projects">
<title>PAYMON / projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#10110d;--fg:#e9e9df;--muted:#77796c;--line:#303229;--acid:#d9ff62}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(#d9ff62 0.65px,transparent .65px);background-size:19px 19px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
.shell{max-width:1080px;margin:auto;padding:28px 26px 50px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}
.logo{font:500 14px 'DM Mono',monospace;letter-spacing:.14em;direction:ltr}.logo b{color:var(--acid);font-weight:500}
.github{color:var(--muted);font:12px 'DM Mono',monospace;text-decoration:none;direction:ltr}.github:hover{color:var(--acid)}
.hero{padding:clamp(65px,12vw,135px) 0 55px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px}
.kicker{font:11px 'DM Mono',monospace;color:var(--acid);direction:ltr;text-align:right}
h1{font-size:clamp(46px,10vw,110px);line-height:.98;letter-spacing:-.07em;margin:20px 0 0;font-weight:800}
h1 span{color:var(--acid)}
.hero-side{font:11px 'DM Mono',monospace;color:var(--muted);writing-mode:vertical-rl;direction:ltr;letter-spacing:.08em}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;margin-bottom:24px}
input{background:transparent;border:0;outline:0;color:var(--fg);font:14px Vazirmatn,sans-serif;width:100%;min-width:0}
input::placeholder{color:var(--muted)}
.search{display:flex;align-items:center;gap:12px;flex:1}.search-mark{font:18px 'DM Mono';color:var(--acid)}
.count{white-space:nowrap;color:var(--muted);font:11px 'DM Mono',monospace;direction:ltr}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 22px}
.project{min-width:0;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);padding:22px 0 20px;display:grid;grid-template-columns:34px 1fr 20px;gap:12px;align-items:start;transition:color .2s}
.project:hover{color:var(--acid)}
.num{font:10px 'DM Mono',monospace;color:var(--muted);padding-top:5px;direction:ltr}
.name{font:13px 'DM Mono',monospace;direction:ltr;text-align:right;overflow-wrap:anywhere}
.desc{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.7;max-height:36px;overflow:hidden}
.arrow{font:14px 'DM Mono',monospace;color:var(--muted);transition:transform .2s}.project:hover .arrow{color:var(--acid);transform:translate(-3px,-3px)}
.empty{grid-column:1/-1;padding:50px 0;color:var(--muted);font-size:13px}
footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:85px;padding-top:18px;color:var(--muted);font:10px 'DM Mono',monospace;direction:ltr}
footer span:last-child{color:var(--acid)}
@media(max-width:760px){.projects{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.hero{padding-top:85px}}
@media(max-width:480px){.shell{padding:20px 17px 35px}.projects{grid-template-columns:1fr}.hero{padding:75px 0 38px}.hero-side{font-size:9px}h1{font-size:clamp(48px,15vw,76px)}footer{gap:12px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main class="shell">
<header><div class="logo">PAYMON <b>↗</b> LAB</div><a class="github" href="https://github.com/paymon1" target="_blank" rel="noopener">GITHUB ↗</a></header>
<section class="hero"><div><div class="kicker">INDEPENDENT PROJECTS / 2026</div><h1>Small things.<br><span>Big ideas.</span></h1></div><div class="hero-side">A PERSONAL INDEX — 01</div></section>
<div class="bar"><label class="search"><span class="search-mark">⌕</span><input id="search" type="search" placeholder="جستجو..." autocomplete="off" aria-label="Search projects"></label><span class="count" id="count">— PROJECTS</span></div>
<section class="projects" id="projects"><div class="empty">Loading…</div></section>
<footer><span>© PAYMON · MADE WITH INTENT</span><span id="status">FETCHING INDEX</span></footer>
</main>
<script>
const $=s=>document.querySelector(s),grid=$('#projects'),search=$('#search'),count=$('#count');let projects=[];
const fallback=['links','longform','portfolio','hub','283000','coinpayu','fund-management','management','paymon1.github.io','trends','charisma','turquoise','tabdeal','wallex','easyhits','dongi','mitra','tools'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){let q=search.value.trim().toLowerCase(),list=projects.filter(p=>(p.name+' '+p.description).toLowerCase().includes(q));count.textContent=String(list.length).padStart(2,'0')+' / PROJECTS';grid.innerHTML=list.length?list.map((p,i)=>'<a class="project" href="'+esc(p.url)+'" target="_blank" rel="noopener"><span class="num">'+String(i+1).padStart(2,'0')+'</span><div><div class="name">'+esc(p.name)+'</div><div class="desc">'+esc(p.description||'Open project ↗')+'</div></div><span class="arrow">↗</span></a>').join(''):'<div class="empty">چیزی پیدا نشد.</div>'}
search.addEventListener('input',draw);
fetch('https://api.github.com/users/paymon1/repos?per_page=100&sort=updated').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{projects=data.filter(r=>!r.fork).map(r=>({name:r.name,description:r.description||'',url:'https://paymon1.github.io/'+r.name+'/'})).sort((a,b)=>a.name.localeCompare(b.name));$('#status').textContent='LIVE INDEX · '+projects.length;draw()}).catch(()=>{projects=fallback.map(name=>({name,description:'',url:'https://paymon1.github.io/'+name+'/'}));$('#status').textContent='OFFLINE INDEX';draw()});
</script></body></html>
