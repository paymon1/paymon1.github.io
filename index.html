<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><meta name="description" content="مرکز پروژه‌ها و ابزارهای Paymon">
<title>Paymon — مرکز پروژه‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#11182b;--card:#141d32;--line:#26314b;--text:#edf2ff;--muted:#9ba9c5;--accent:#8b9cff;--glow:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#1c2450 0,transparent 42%),var(--bg);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1120px;margin:auto;padding:36px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:64px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#a7b5ff,#7155f5);display:grid;place-items:center;color:#080d1c;font-size:22px;box-shadow:0 8px 30px #7155f544}.top a{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:9px 15px;border-radius:12px;font-size:13px}.hero{text-align:center;margin-bottom:42px}.eyebrow{color:#a9b4ff;font-size:13px;letter-spacing:.04em}.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.25;margin:14px 0 16px;font-weight:800;letter-spacing:-1.5px}.hero h1 span{background:linear-gradient(90deg,#b7c4ff,#8b77ff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);margin:0 auto;max-width:540px;line-height:2;font-size:15px}.tools{display:flex;gap:12px;max-width:650px;margin:30px auto 0}.search{flex:1;position:relative}.search input{width:100%;background:#11182bd9;border:1px solid var(--line);border-radius:15px;padding:15px 48px 15px 16px;color:var(--text);font:inherit;outline:none}.search input:focus{border-color:#7d8cff;box-shadow:0 0 0 3px #7d8cff20}.search:before{content:"⌕";position:absolute;right:17px;top:8px;font-size:25px;color:var(--muted)}.count{align-self:center;color:var(--muted);font-size:13px;white-space:nowrap}.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 16px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:linear-gradient(145deg,#151e34,#101729);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:160px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:.2s;position:relative;overflow:hidden}.card:hover{transform:translateY(-4px);border-color:#6676d8;box-shadow:0 14px 40px #0003}.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.repo-icon{width:36px;height:36px;border-radius:11px;background:#222d49;color:#aebaff;display:grid;place-items:center;font-size:16px}.arrow{color:#71809e;font-size:18px}.card h3{font-size:15px;margin:0 0 8px;direction:ltr;text-align:right;overflow-wrap:anywhere}.card p{font-size:12px;color:var(--muted);line-height:1.8;margin:0;flex:1}.meta{display:flex;gap:8px;align-items:center;margin-top:15px;font-size:11px;color:#8998b6}.dot{width:6px;height:6px;border-radius:50%;background:#7b8cff}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px}.footer{border-top:1px solid var(--line);margin-top:55px;padding-top:22px;display:flex;justify-content:space-between;color:#75829d;font-size:12px}.footer a{color:#aab6ff;text-decoration:none}.loading{color:var(--muted);text-align:center;padding:45px;grid-column:1/-1}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{margin-bottom:45px}}
@media(max-width:540px){.wrap{padding:22px 15px 40px}.grid{grid-template-columns:1fr}.hero{margin-bottom:30px}.tools{flex-direction:column}.count{text-align:center}.footer{gap:12px;flex-direction:column;text-align:center}.card{min-height:145px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="mark">P</div><span>PAYMON<span style="color:#8997ff">.</span></span></div><a href="https://github.com/paymon1" target="_blank" rel="noopener">گیت‌هاب ↗</a></header>
<section class="hero"><div class="eyebrow">یک نقطه برای همه چیز</div><h1>پروژه‌ها، در <span>یک نگاه.</span></h1><p>مرکز دسترسی به پروژه‌ها، ابزارها و تجربه‌های من.<br>جستجو کن و مستقیم وارد هر پروژه شو.</p>
<div class="tools"><div class="search"><input id="search" type="search" placeholder="جستجوی پروژه..." autocomplete="off" aria-label="جستجوی پروژه"></div><div class="count" id="count">در حال بارگذاری…</div></div></section>
<div class="section-head"><h2>همه پروژه‌ها</h2><span>به‌روز از GitHub</span></div>
<section class="grid" id="projects"><div class="loading">در حال دریافت پروژه‌ها…</div></section>
<footer class="footer"><span>ساخته‌شده با دقت و کنجکاوی ✦</span><a href="https://github.com/paymon1" target="_blank" rel="noopener">github.com/paymon1 ↗</a></footer>
</main>
<script>
const grid=document.getElementById('projects'),search=document.getElementById('search'),count=document.getElementById('count');let repos=[];
const fallback=['links','longform','portfolio','hub','283000','coinpayu','fund-management','management','paymon1.github.io','trends','charisma','turquoise','tabdeal','wallex','easyhits','dongi','mitra','tools'].map(name=>({name,html_url:'https://paymon1.github.io/'+name,description:'پروژه و ابزار آنلاین',homepage:'',fork:false}));
function render(){const q=search.value.trim().toLowerCase();const list=repos.filter(r=>(r.name+' '+(r.description||'')).toLowerCase().includes(q));count.textContent=list.length+' پروژه';grid.innerHTML=list.length?list.map(r=>'<a class="card" href="'+r.url+'" target="_blank" rel="noopener"><div class="card-top"><div class="repo-icon">⌘</div><span class="arrow">↗</span></div><h3>'+esc(r.name)+'</h3><p>'+esc(r.description||'پروژه در گیت‌هاب')+'</p><div class="meta"><span class="dot"></span>'+ (r.live?'وب‌سایت فعال':'مخزن GitHub')+'</div></a>').join(''):'<div class="empty">پروژه‌ای با این عبارت پیدا نشد.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
search.addEventListener('input',render);
fetch('https://api.github.com/users/paymon1/repos?per_page=100&sort=updated').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{repos=data.filter(r=>!r.fork).map(r=>({name:r.name,description:r.description,url:r.homepage||r.html_url,live:!!r.homepage}));repos.sort((a,b)=>a.name.localeCompare(b.name));render()}).catch(()=>{repos=fallback.map(r=>({name:r.name,description:r.description,url:r.html_url,live:true}));render()});
</script></body></html>
